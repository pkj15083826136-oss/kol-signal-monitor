name: Exchange and fund-flow intelligence

on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-intelligence.yml"
      - "scripts/collect-exchange-events.mjs"
      - "scripts/binance-spot-snapshot.mjs"
      - "scripts/collect-whale-alert.mjs"
      - "scripts/collect-bitquery.mjs"
      - "scripts/collect-public-stablecoin-flows.mjs"
      - "scripts/collect-new-listings-feed.mjs"
      - "scripts/collect-upbit-announcements.mjs"
      - "scripts/run-exchange-loop.mjs"
      - "app/api/exchange-events/**"
      - "app/api/fund-flows/**"
      - "lib/exchange-intelligence.ts"

concurrency:
  group: market-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - name: Minute exchange monitoring
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          COLLECTOR_DURATION_MS: "1500000"
        run: node scripts/run-exchange-loop.mjs
  upbit-announcements:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upbit official announcement stream
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          UPBIT_ACCESS_KEY: ${{ secrets.UPBIT_ACCESS_KEY }}
          UPBIT_SECRET_KEY: ${{ secrets.UPBIT_SECRET_KEY }}
          COLLECTOR_DURATION_MS: "1500000"
        run: node scripts/collect-upbit-announcements.mjs
  new-listings-feed:
    if: ${{ vars.NEW_LISTINGS_FEED_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Coinbase and Upbit third-party discovery feed
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          NLF_API_KEY: ${{ secrets.NLF_API_KEY }}
          NEW_LISTINGS_FEED_ENABLED: ${{ vars.NEW_LISTINGS_FEED_ENABLED }}
          COLLECTOR_DURATION_MS: "1500000"
        run: node scripts/collect-new-listings-feed.mjs
  fund-flow:
    if: ${{ vars.WHALE_ALERT_ENABLED == 'true' && vars.WHALE_ALERT_PUBLIC_DISTRIBUTION_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - name: Real-time attributed fund flow
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          WHALE_ALERT_API_KEY: ${{ secrets.WHALE_ALERT_API_KEY }}
          WHALE_ALERT_PUBLIC_DISTRIBUTION_APPROVED: ${{ vars.WHALE_ALERT_PUBLIC_DISTRIBUTION_APPROVED }}
          COLLECTOR_DURATION_MS: "1500000"
        run: node scripts/collect-whale-alert.mjs
  bitquery-fund-flow:
    if: ${{ vars.BITQUERY_ENABLED == 'true' && vars.BITQUERY_PUBLIC_DISTRIBUTION_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Licensed Bitquery large-transfer streams
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          BITQUERY_ACCESS_TOKEN: ${{ secrets.BITQUERY_ACCESS_TOKEN }}
          BITQUERY_ENABLED: ${{ vars.BITQUERY_ENABLED }}
          BITQUERY_PUBLIC_DISTRIBUTION_APPROVED: ${{ vars.BITQUERY_PUBLIC_DISTRIBUTION_APPROVED }}
          COLLECTOR_DURATION_MS: "1500000"
        run: node scripts/collect-bitquery.mjs
  public-stablecoin-flow:
    if: ${{ vars.PUBLIC_FLOW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - name: Limited public Ethereum stablecoin flow
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          COLLECTOR_DURATION_MS: "1500000"
        run: node scripts/collect-public-stablecoin-flows.mjs
