name: Exchange and fund-flow intelligence

on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-intelligence.yml"
      - "scripts/collect-exchange-events.mjs"
      - "scripts/binance-spot-snapshot.mjs"
      - "scripts/collect-whale-alert.mjs"
      - "scripts/collect-upbit-announcements.mjs"
      - "scripts/run-exchange-loop.mjs"
      - "app/api/exchange-events/**"
      - "app/api/fund-flows/**"
      - "lib/exchange-intelligence.ts"

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v4
      - name: Minute exchange monitoring
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          COLLECTOR_DURATION_MS: "3300000"
        run: node scripts/run-exchange-loop.mjs
  upbit-announcements:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upbit official announcement stream
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          UPBIT_ACCESS_KEY: ${{ secrets.UPBIT_ACCESS_KEY }}
          UPBIT_SECRET_KEY: ${{ secrets.UPBIT_SECRET_KEY }}
          COLLECTOR_DURATION_MS: "1980000"
        run: node scripts/collect-upbit-announcements.mjs
  fund-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: Real-time attributed fund flow
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          WHALE_ALERT_API_KEY: ${{ secrets.WHALE_ALERT_API_KEY }}
          COLLECTOR_DURATION_MS: "1980000"
        run: node scripts/collect-whale-alert.mjs
