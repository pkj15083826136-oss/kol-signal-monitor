name: KOL signal monitor
# Continuous collector; code and schedule changes restart the active polling window.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor.yml"
      - "scripts/collect-gmgn.mjs"
      - "app/api/monitor/run/route.ts"

concurrency:
  group: kol-signal-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Poll monitored wallets every minute
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          set -euo pipefail
          chains=(sol bsc base robinhood)
          failures=0
          consecutive_failures=0
          for attempt in $(seq 1 40); do
            chain_index=$(( (attempt - 1) % 4 ))
            if ! MONITOR_CHAIN="${chains[$chain_index]}" node scripts/collect-gmgn.mjs; then
              echo "collector failed for ${chains[$chain_index]}; continuing with the next chain"
              failures=$((failures + 1))
              consecutive_failures=$((consecutive_failures + 1))
              if [ "$consecutive_failures" -ge 3 ]; then
                echo "stopping after 3 consecutive collector failures"
                break
              fi
            else
              consecutive_failures=0
            fi
            if [ "$attempt" -lt 40 ]; then sleep 48; fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "$failures collector attempt(s) failed"
            exit 1
          fi
      - name: Enrich a bounded radar backlog batch
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: node scripts/run-radar-enrichment.mjs
