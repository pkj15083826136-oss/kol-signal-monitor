name: KOL signal monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: kol-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Poll monitored wallets every minute
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 5); do
            node <<'NODE'
            const chains = ["sol", "bsc", "base", "robinhood"];
            const chain = chains[Math.floor(Date.now() / 60000) % chains.length];
            async function gmgn(kind) {
              const query = new URLSearchParams({
                chain, limit: "200", timestamp: String(Math.floor(Date.now() / 1000)),
                client_id: crypto.randomUUID(),
              });
              const response = await fetch(`https://openapi.gmgn.ai/v1/user/${kind}?${query}`, {
                headers: { "X-APIKEY": process.env.GMGN_API_KEY, "Content-Type": "application/json" },
              });
              const payload = await response.json();
              if (!response.ok || payload.code !== 0) throw new Error(`${kind}: ${payload.message || response.status}`);
              return payload.data;
            }
            const kol = await gmgn("kol");
            await new Promise((resolve) => setTimeout(resolve, 2000));
            const smartmoney = await gmgn("smartmoney");
            const response = await fetch(`${process.env.SITE_URL.replace(/\/$/, "")}/api/monitor/run?chain=${chain}`, {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.MONITOR_SECRET}`, "Content-Type": "application/json" },
              body: JSON.stringify({ feeds: { kol, smartmoney } }),
            });
            const text = await response.text();
            console.log(text);
            if (!response.ok) throw new Error(`site HTTP ${response.status}`);
            NODE
            if [ "$attempt" -lt 5 ]; then sleep 60; fi
          done
