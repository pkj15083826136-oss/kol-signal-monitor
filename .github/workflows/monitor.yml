name: KOL signal monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor.yml"
      - "scripts/collect-gmgn.mjs"
      - "app/api/monitor/run/route.ts"

concurrency:
  group: kol-signal-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Poll monitored wallets every minute
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          set -euo pipefail
          chains=(sol bsc base robinhood)
          for attempt in $(seq 1 75); do
            chain_index=$(( (attempt - 1) % 4 ))
            if ! MONITOR_CHAIN="${chains[$chain_index]}" node scripts/collect-gmgn.mjs; then
              echo "collector failed for ${chains[$chain_index]}; continuing with the next chain"
            fi
            if [ "$attempt" -lt 75 ]; then sleep 48; fi
          done
