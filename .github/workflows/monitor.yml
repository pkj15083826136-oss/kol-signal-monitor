name: KOL signal monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: kol-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Poll monitored wallets every minute
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 5); do
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${MONITOR_SECRET}" \
              "${SITE_URL%/}/api/monitor/run"
            if [ "$attempt" -lt 5 ]; then sleep 60; fi
          done
