name: KOL signal monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor.yml"
      - "scripts/collect-gmgn.mjs"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: kol-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Poll monitored wallets every minute
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 5); do
            node scripts/collect-gmgn.mjs
            if [ "$attempt" -lt 5 ]; then sleep 60; fi
          done
